name: Daily Dealer Data Release

on:
  schedule:
    # Läuft jeden Tag um 01:00 Uhr UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Erlaubt manuelles Auslösen

permissions:
  contents: write

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run Dealer Data Script
        run: python app.py
      
      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Dealer Data ${{ steps.date.outputs.date }}
          body: |
            Automatisch generierte Händlerdaten vom ${{ steps.date.outputs.date }}
            
            Diese Version enthält:
            - dealers.json: Alle Händlerdaten
            - DEU*.json: Individuelle Händlerdateien
          files: |
            dealers.json
            DEU*.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
