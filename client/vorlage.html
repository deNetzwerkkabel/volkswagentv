<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>VolkswagenTV - Autoanzeige</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        @font-face {
            font-family: font;
            src: url("https://www.volkswagen.de/etc.clientlibs/clientlibs/vwa-ngw18/ngw18-frontend/apps/resources/statics/fonts/vwtext-regular.woff2");
        }

        @font-face {
            font-family: font_bold;
            src: url("https://www.volkswagen.de/etc.clientlibs/clientlibs/vwa-ngw18/ngw18-frontend/apps/resources/statics/fonts/vwtext-bold.woff2");
        }
        body {
            font-family: font;
            background-color: rgb(8, 29, 77);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }
        .loadingContainer, .carItem {
            width: 90%;
            height: 90%;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .carTypeLabel {
            font-size: 24px;
            font-weight: bold;
        }
        .title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: font_bold;
        }
        .subtitle {
            font-size: 20px;
            margin-bottom: 10px;
            font-family: font_bold;
        }
        .price {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: font_bold;
        }
        .priceDetails {
            font-size: 16px;
            font-weight: normal;
            font-family: font;
        }
        .info-box {
            margin: 0;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        .border-blue {
            border: 1.5px solid rgb(8, 29, 77);
        }
        .carousel {
            margin-bottom: 20px;
            max-height: 800px; /* Feste Höhe */
        }
        .carousel-item img {
            object-fit: contain;
        }
        .listGroup {
            border-top: 1px solid #ddd;
            margin-top: 20px;
            padding-top: 20px;
        }
        .listGroupItem {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .colSm5 {
            font-weight: bold;
        }
        .col-image {
            width: 70%;
        }
        .infoContainer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        .qrCode {
            width: 100px;
            height: 100px;
            margin-top: 10px;
            align-self: center;
        }
        .info {
            font-size: 14px;
        }
    </style>
</head>
<body>
<div id="carContainer">
    <div class="carItem p-5">
        <div class="carTypeLabel"><strong id="carTypeLabel"></strong></div>
        <div class="title" id="title">${title}</div>
        <div class="subtitle" id="subtitle">${subtitle}</div>
        <div class="row" style="height: 80%;">
            <div class="col col-image">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carousel">
                        <div class="carousel-item ${activeClass} rounded-3"><img src="${img.href}" class="d-block w-100"></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-5">
                <div class="info-box">
                    <div class="border-blue" style="padding: 3rem;">
                        <div class="price" id="price">${price}</div>
                        <div class="listGroup">
                            <div class="listGroupItem">
                                <div class="colSm5"><strong>Motor</strong></div>
                                <div id="motor">${motor}</div>
                            </div>
                            <div class="listGroupItem">
                                <div class="colSm5"><strong>Modelljahr</strong></div>
                                <div id="modelYear">${modelYear}</div>
                            </div>
                            <div class="listGroupItem">
                                <div class="colSm5"><strong>Getriebeart</strong></div>
                                <div id="gear">${gear}</div>
                            </div>
                            <div class="listGroupItem">
                                <div class="colSm5"><strong>Kilometerstand</strong></div>
                                <div id="mileage">${mileage}</div>
                            </div>
                        </div>
                        <div class="infoContainer">
                            <div class="row">
                                <div class="col">
                                    <img id="qrCode" src="" alt="QR Code" width="200" height="200">
                                </div>
                                <div class="col">
                                    <div id="dealerLabel">${dealerLabel}</div>
                                    <div id="dealerStreet">${dealerStreet}</div>
                                    <div id="dealerAddress">${dealerAddress}</div>
                                </div>
                            </div>
                            <div class="info"><small>Dieses Angebot ist unverbindlich und freibleibend. Irrtümer und Änderungen vorbehalten.</small></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
